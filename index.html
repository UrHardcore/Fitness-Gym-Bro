<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E0E10">

<!-- Configuración PWA & iOS / Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">

<!-- Íconos y Manifest -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<title>LiftLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --bg: #0E0E10;
    --surface: #18181B;
    --surface-2: #202024;
    --text: #EDEDEC;
    --text-muted: #8A8A8E;
    --accent: #C1443D;
    --accent-soft: rgba(193,68,61,0.16);
    --border: #2A2A2E;
    --card-shadow: rgba(0,0,0,0.5);
  }

  [data-theme="light"] {
    --bg: #F4F4F5;
    --surface: #FFFFFF;
    --surface-2: #E4E4E7;
    --text: #18181B;
    --text-muted: #71717A;
    --accent: #D93829;
    --accent-soft: rgba(217, 56, 41, 0.12);
    --border: #D4D4D8;
    --card-shadow: rgba(0,0,0,0.05);
  }

  *{ box-sizing: border-box; margin:0; padding:0; user-select:none; }

  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 32px 18px 60px;
  }

  .card{ width:100%; max-width: 440px; position: relative; }

  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

  .eyebrow{ font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

  .top-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .theme-toggle, .icon-nav-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }

  .streak-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px;
  }

  .headline{
    font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: 0.01em;
    font-size: clamp(40px, 12vw, 58px); line-height: 0.95; text-transform: uppercase; margin-bottom: 4px;
  }

  .headline.rest{ color: var(--text-muted); }

  .subline{ font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
  .subline strong{ color: var(--text); font-weight: 600; }

  .quote-box {
    font-size: 12px; font-style: italic; color: var(--text-muted);
    border-left: 2px solid var(--accent); padding-left: 8px; margin-bottom: 20px;
  }

  .timer-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
  }

  .timer-display { font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--text); }
  .timer-btn-group { display: flex; gap: 6px; }

  .timer-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  .routine-card{
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 24px; box-shadow: 0 4px 12px var(--card-shadow);
  }

  .routine-card .rc-title{
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }

  .ex-list{ list-style:none; display:flex; flex-direction:column; gap: 8px; }

  .ex-item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 10px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; gap: 8px;
  }

  .ex-main-click{ display:flex; align-items:center; gap: 10px; flex:1; cursor:pointer; }

  .ex-check{
    width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--text-muted);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }

  .ex-item.checked .ex-check{ background: var(--accent); border-color: var(--accent); }
  .ex-check svg{ opacity:0; }
  .ex-item.checked .ex-check svg{ opacity:1; }

  .ex-name{ font-size: 13px; font-weight: 500; color: var(--text); }
  .ex-item.checked .ex-name{ color: var(--text-muted); text-decoration: line-through; }

  .ex-inputs{ display:flex; align-items:center; gap: 4px; }
  .ex-inputs input{
    width: 42px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 12px; padding: 4px 2px; text-align: center;
  }

  .action-icon-btn {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 3px; font-size: 14px;
  }

  .add-section{ margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .custom-row{ display:flex; gap: 8px; }

  .custom-row input{
    flex:1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text);
  }

  .custom-row button{
    background: var(--accent); color: #0E0E10; border:none;
    border-radius: 8px; padding: 0 14px; font-size: 13px; font-weight: 700; cursor:pointer;
  }

  .barbell{
    display:flex; align-items:center; gap: 0; margin: 8px 0 26px; padding: 16px 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto;
  }

  .bar-line{ flex:1; height: 4px; background: linear-gradient(90deg, var(--border), var(--text-muted), var(--border)); min-width: 6px; }

  .plate{
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border);
    background: var(--surface-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; position:relative;
  }

  .plate .letter{ font-family:'Anton', sans-serif; font-size: 15px; color: var(--text-muted); }
  .plate.done{ background: var(--accent); border-color: var(--accent); }
  .plate.done .letter{ color: #0E0E10; }
  .plate.today:not(.done){ border-color: var(--text); }

  .plate .dot{
    position:absolute; top:-2px; right:-2px; width:7px; height:7px;
    border-radius:50%; background: var(--accent); display:none;
  }
  .plate.today .dot{ display:block; }

  .list{ display:flex; flex-direction:column; gap: 8px; margin-bottom: 26px; }
  .row{ background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow:hidden; }
  .row.done{ background: var(--accent-soft); border-color: var(--accent); }

  .row-main{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; cursor:pointer; }
  .row-left{ display:flex; align-items:center; gap: 12px; }

  .checkbox{ width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--text-muted); display:flex; align-items:center; justify-content:center; }
  .row.done .checkbox{ background: var(--accent); border-color: var(--accent); }
  .checkbox svg{ opacity:0; }
  .row.done .checkbox svg{ opacity:1; }

  .row-text{ display:flex; flex-direction:column; gap:2px; }
  .row-label{ font-weight: 600; font-size: 15px; }
  .row-group{ font-size: 12px; color: var(--text-muted); }

  .row-right{ display:flex; align-items:center; gap: 12px; }
  .row-status{ font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; }
  .row.done .row-status{ color: var(--accent); }

  .chevron{ width: 22px; height: 22px; display:flex; align-items:center; justify-content:center; color: var(--text-muted); transition: transform .2s ease; }
  .chevron.open{ transform: rotate(180deg); }

  .row-exercises{ max-height: 0; overflow:hidden; transition: max-height .3s ease; border-top: 1px solid transparent; }
  .row-exercises.open{ max-height: 800px; border-top: 1px solid var(--border); }
  .row-exercises-inner{ padding: 14px 16px; }

  .progress-block{ display:flex; flex-direction:column; gap: 8px; }
  .progress-top{ display:flex; justify-content:space-between; font-size: 13px; color: var(--text-muted); }
  .progress-top strong{ color: var(--text); }

  .bar-track{ height: 6px; background: var(--surface-2); border-radius: 3px; overflow:hidden; border: 1px solid var(--border); }
  .bar-fill{ height: 100%; background: var(--accent); width: 0%; transition: width .4s ease; }

  .reset-link{ margin-top: 22px; text-align:center; }
  .reset-link button{ background:none; border:none; color: var(--text-muted); font-size: 12px; cursor:pointer; text-decoration: underline; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 420px; padding: 20px;
    max-height: 85vh; overflow-y: auto; position: relative;
  }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .chart-container { width: 100%; height: 200px; position: relative; }
  canvas { width: 100%!important; height: 100%!important; }

  .wizard-step-title { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .wizard-step-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .wizard-select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px; border-radius: 6px; margin-bottom: 14px; font-size: 13px;
  }
  .wizard-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .wizard-item {
    display: flex; align-items: center; gap: 10px; background: var(--surface-2);
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; cursor: pointer;
  }
  .wizard-item input { accent-color: var(--accent); width: 16px; height: 16px; }
  .wizard-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }

  .train-overlay { text-align: center; padding: 20px 0; }
  .train-title {
    font-family: 'Anton', sans-serif; font-size: 48px; color: var(--accent);
    letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header-top">
    <div>
      <div id="userGreeting" style="font-size:13px; font-weight:700; color:var(--text);">Hola</div>
      <div class="eyebrow" id="weekLabel">Semana</div>
    </div>
    <div class="top-actions">
      <button class="icon-nav-btn" onclick="openTutorialModal()">❓ Tutorial</button>
      <button class="icon-nav-btn" onclick="open1RMModal()">🧮 1RM</button>
      <button class="icon-nav-btn" onclick="openWizardModal()">⚙️ Rutina</button>
      <button class="theme-toggle" id="themeBtn">☀️ / 🌙</button>
    </div>
  </div>

  <div class="streak-badge">
    🔥 Racha: <span id="streakCount">0 días</span>
  </div>

  <div class="headline" id="headline">—</div>
  <div class="subline" id="subline">Cargando…</div>
  <div class="quote-box" id="quoteBox">"La constancia vence a la intensidad."</div>

  <div class="timer-card">
    <div>
      <div style="font-size:10px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Descanso</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
    </div>
    <div class="timer-btn-group">
      <button class="timer-btn" onclick="startTimer(60)">60s</button>
      <button class="timer-btn" onclick="startTimer(90)">90s</button>
      <button class="timer-btn" onclick="startTimer(120)">2m</button>
      <button class="timer-btn" onclick="resetTimer()">⏸</button>
    </div>
  </div>

  <div class="routine-card" id="routineCard" style="display:none;"></div>
  <div class="barbell" id="barbell"></div>
  <div class="list" id="list"></div>

  <div class="progress-block">
    <div class="progress-top">
      <span>Progreso semanal</span>
      <strong id="progressText">0/7</strong>
    </div>
    <div class="bar-track"><div class="bar-fill" id="progressFill"></div></div>
  </div>

  <div class="reset-link">
    <button id="resetBtn">Reiniciar esta semana</button>
  </div>
</div>

<div class="modal-overlay" id="chartModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="chartTitle">Evolución</div>
      <button class="action-icon-btn" onclick="closeModal('chartModal')">✖</button>
    </div>
    <div class="chart-container"><canvas id="progressChart"></canvas></div>
  </div>
</div>

<div class="modal-overlay" id="rmModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">Calculadora 1RM</div>
      <button class="action-icon-btn" onclick="closeModal('rmModal')">✖</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="number" id="rmWeight" class="wizard-select" placeholder="Peso (kg)" style="margin:0;">
      <input type="number" id="rmReps" class="wizard-select" placeholder="Reps" style="margin:0;">
    </div>
    <button class="timer-btn" style="width:100%; padding:8px;" onclick="calculate1RM()">Calcular 1RM</button>
    <div id="rmResult" style="margin-top:12px; font-weight:700; font-size:16px; text-align:center;"></div>
  </div>
</div>

<div class="modal-overlay" id="wizardModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">Configurar Rutina</div>
      <button class="action-icon-btn" onclick="closeModal('wizardModal')">✖</button>
    </div>
    <div id="wizardBody"></div>
    <div class="wizard-nav">
      <button class="timer-btn" id="wizPrevBtn" onclick="wizPrev()">Anterior</button>
      <button class="timer-btn" id="wizNextBtn" onclick="wizNext()" style="background:var(--accent); color:#0E0E10;">Siguiente</button>
    </div>
    <hr style="border-color:var(--border); margin:16px 0 12px;">
    <div style="display:flex; gap:8px;">
      <button class="timer-btn" style="flex:1;" onclick="exportJSON()">Exportar Backup</button>
      <button class="timer-btn" style="flex:1;" onclick="document.getElementById('importFile').click()">Importar Backup</button>
      <input type="file" id="importFile" style="display:none;" onchange="importJSON(event)">
    </div>
  </div>
</div>

<div class="modal-overlay" id="onboardingModal">
  <div class="modal-card" id="onboardingBody"></div>
</div>

<script>
  const MOTIVATIONAL_QUOTES = [
    '"La constancia vence a la intensidad."',
    '"Cada repetición te acerca a tu meta."',
    '"No busques excusas, busca resultados."',
    '"El entrenamiento de hoy es tu fuerza de mañana."',
    '"La disciplina es hacer lo que debes incluso cuando no quieres."'
  ];

  const PRESET_EXERCISES = {
    'Tren superior': ['Press de banca', 'Remo con barra', 'Press militar', 'Dominadas', 'Curl de bíceps', 'Extensión de tríceps', 'Press inclinado', 'Elevaciones laterales', 'Fondos', 'Face pull'],
    'Tren inferior': ['Sentadilla', 'Peso muerto rumano', 'Prensa de piernas', 'Zancadas', 'Curl femoral', 'Elevación de talones', 'Hip thrust', 'Sentadilla búlgara', 'Extensión de cuádriceps'],
    'Fullbody / Movilidad': ['Estiramientos', 'Core', 'Plancha', 'Kettlebell swings', 'Dominadas suaves'],
    'Descanso / Cardio': ['Cinta 30 min', 'Bicicleta 20 min', 'Abdominales', 'Caminata ligera']
  };

  const DEFAULT_DAYS = [
    { id: 'lunes', label: 'Lunes', short: 'L', jsDay: 1, group: 'Tren superior', exercises: ['Press de banca', 'Remo con barra', 'Press militar'] },
    { id: 'martes', label: 'Martes', short: 'M', jsDay: 2, group: 'Tren inferior', exercises: ['Sentadilla', 'Peso muerto rumano', 'Prensa de piernas'] },
    { id: 'miercoles', label: 'Miércoles', short: 'X', jsDay: 3, group: 'Descanso / Cardio', exercises: ['Cinta 30 min', 'Abdominales'] },
    { id: 'jueves', label: 'Jueves', short: 'J', jsDay: 4, group: 'Tren superior', exercises: ['Press inclinado', 'Dominadas', 'Elevaciones laterales'] },
    { id: 'viernes', label: 'Viernes', short: 'V', jsDay: 5, group: 'Tren inferior', exercises: ['Sentadilla búlgara', 'Hip thrust', 'Curl femoral'] },
    { id: 'sabado', label: 'Sábado', short: 'S', jsDay: 6, group: 'Fullbody / Movilidad', exercises: ['Estiramientos', 'Core'] },
    { id: 'domingo', label: 'Domingo', short: 'D', jsDay: 0, group: 'Descanso / Cardio', exercises: [] }
  ];

  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function fmt(date){ return date.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }); }

  const today = new Date();
  const monday = getMonday(today);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  const weekKey = 'gym-week:' + monday.toISOString().slice(0,10);
  const customRoutineKey = 'gym-custom-routine';
  const extraKey = 'gym-routine-extra';
  const historyKey = 'gym-routine-history';
  const streakKey = 'gym-routine-streak';
  const userNameKey = 'gym-user-name';

  const todayJs = today.getDay();

  let BASE_DAYS = [];
  let dayState = {}, exState = {}, extra = {}, historyData = {}, streak = 0, expanded = {};
  let timerInterval = null, timerSeconds = 0;
  let wizardStep = 0, tempRoutine = [], userName = '';
  let obStep = 0, tutorialStep = 0;

  function playSuccessSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } catch(e){}
  }

  function playRonnieColemanAudio() {
    const audio = new Audio("https://www.myinstants.com/media/sounds/yeah-buddy-lightweight.mp3");
    audio.play().catch(() => {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance("Yeah Buddy! Light Weight Baby!");
        msg.pitch = 0.8;
        msg.rate = 1.1;
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
      }
    });
  }

  function triggerConfetti() {
    if(window.confetti) confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
  }

  function startTimer(sec) {
    clearInterval(timerInterval);
    timerSeconds = sec;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if(timerSeconds <= 0) { clearInterval(timerInterval); playSuccessSound(); }
    }, 1000);
  }

  function resetTimer() { clearInterval(timerInterval); timerSeconds = 0; updateTimerDisplay(); }
  function updateTimerDisplay() {
    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const s = String(timerSeconds % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  }

  function loadState(){
    userName = localStorage.getItem(userNameKey) || '';
    try {
      const savedRoutine = localStorage.getItem(customRoutineKey);
      BASE_DAYS = savedRoutine ? JSON.parse(savedRoutine) : DEFAULT_DAYS;

      const parsed = JSON.parse(localStorage.getItem(weekKey)) || {};
      dayState = parsed.days || {};
      exState = parsed.exercises || {};
      extra = JSON.parse(localStorage.getItem(extraKey)) || {};
      historyData = JSON.parse(localStorage.getItem(historyKey)) || {};
      streak = parseInt(localStorage.getItem(streakKey) || '0', 10);
    } catch(e) { BASE_DAYS = DEFAULT_DAYS; }

    BASE_DAYS.forEach(d => {
      if(!(d.id in dayState)) dayState[d.id] = false;
      if(!(d.id in exState)) exState[d.id] = {};
    });
  }

  function saveWeekState(){ localStorage.setItem(weekKey, JSON.stringify({ days: dayState, exercises: exState })); }
  function saveExtra(){ localStorage.setItem(extraKey, JSON.stringify(extra)); }
  function saveHistory(){ localStorage.setItem(historyKey, JSON.stringify(historyData)); }
  function saveStreak(){ localStorage.setItem(streakKey, streak.toString()); }

  function fullExercises(d){ return (d.exercises || []).concat(extra[d.id] || []); }

  function buildExerciseList(d, editable){
    const ul = document.createElement('ul');
    ul.className = 'ex-list';
    
    fullExercises(d).forEach(ex => {
      const checked = !!(exState[d.id] && exState[d.id][ex]);
      const exHist = historyData[ex] || [];
      const lastWeight = exHist.length ? exHist[exHist.length - 1].kg : '';
      const lastReps = exHist.length ? exHist[exHist.length - 1].reps : '';

      const li = document.createElement('li');
      li.className = 'ex-item' + (checked ? ' checked' : '');

      const mainClick = document.createElement('div');
      mainClick.className = 'ex-main-click';
      mainClick.innerHTML = `
        <div class="ex-check">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4L3.5 6.5L9 1" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="ex-name">${ex}</span>
      `;
      mainClick.addEventListener('click', () => toggleExercise(d.id, ex));

      const inputsWrap = document.createElement('div');
      inputsWrap.className = 'ex-inputs';

      const kgInput = document.createElement('input');
      kgInput.type = 'number'; kgInput.placeholder = 'kg'; kgInput.value = lastWeight;
      kgInput.addEventListener('change', (e) => updateExHistory(ex, e.target.value, lastReps));

      const repsInput = document.createElement('input');
      repsInput.type = 'number'; repsInput.placeholder = 'reps'; repsInput.value = lastReps;
      repsInput.addEventListener('change', (e) => updateExHistory(ex, lastWeight, e.target.value));

      const demoBtn = document.createElement('a');
      demoBtn.className = 'action-icon-btn';
      demoBtn.innerHTML = `🎥`;
      demoBtn.title = 'Ver Técnica';
      demoBtn.target = '_blank';
      demoBtn.href = `https://www.youtube.com/results?search_query=tecnica+${encodeURIComponent(ex)}`;

      const chartBtn = document.createElement('button');
      chartBtn.className = 'action-icon-btn';
      chartBtn.innerHTML = `📈`;
      chartBtn.addEventListener('click', (e) => { e.stopPropagation(); openChartModal(ex); });

      inputsWrap.appendChild(kgInput);
      inputsWrap.appendChild(repsInput);
      inputsWrap.appendChild(demoBtn);
      inputsWrap.appendChild(chartBtn);

      if (extra[d.id] && extra[d.id].includes(ex)) {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-icon-btn';
        delBtn.innerHTML = `🗑️`;
        delBtn.addEventListener('click', (e) => { e.stopPropagation(); removeExercise(d.id, ex); });
        inputsWrap.appendChild(delBtn);
      }

      li.appendChild(mainClick);
      li.appendChild(inputsWrap);
      ul.appendChild(li);
    });

    if(!editable) return ul;

    const wrap = document.createDocumentFragment();
    wrap.appendChild(ul);

    const addSection = document.createElement('div');
    addSection.className = 'add-section';

    const customRow = document.createElement('div');
    customRow.className = 'custom-row';
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = 'Agregar ejercicio extra';
    const btn = document.createElement('button');
    btn.textContent = 'Agregar';

    const handleAdd = () => {
      const val = input.value.trim();
      if(val) addExercise(d.id, val);
    };

    btn.addEventListener('click', handleAdd);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleAdd(); });

    customRow.appendChild(input); customRow.appendChild(btn);
    addSection.appendChild(customRow);
    wrap.appendChild(addSection);
    return wrap;
  }

  function updateExHistory(exName, kg, reps) {
    if(!historyData[exName]) historyData[exName] = [];
    historyData[exName].push({ date: fmt(new Date()), kg: parseFloat(kg)||0, reps: parseInt(reps)||0 });
    saveHistory();
  }

  function render(){
    document.getElementById('userGreeting').textContent = userName ? `Hola, ${userName} 👋` : 'Hola 👋';
    const todayEntry = BASE_DAYS.find(d => d.jsDay === todayJs);
    document.getElementById('weekLabel').textContent = `Semana del ${fmt(monday)} al ${fmt(sunday)}`;
    document.getElementById('streakCount').textContent = `${streak} días`;
    document.getElementById('quoteBox').textContent = MOTIVATIONAL_QUOTES[today.getDay() % MOTIVATIONAL_QUOTES.length];

    const headline = document.getElementById('headline');
    const subline = document.getElementById('subline');
    const routineCard = document.getElementById('routineCard');

    if(todayEntry){
      const done = dayState[todayEntry.id];
      headline.textContent = todayEntry.label;
      headline.classList.remove('rest');
      subline.innerHTML = done
        ? `<strong>Ya entrenaste hoy.</strong> ${todayEntry.group}, ¡gran trabajo!`
        : `Hoy toca <strong>${todayEntry.group.toLowerCase()}</strong>. Tildá al terminar.`;

      routineCard.style.display = 'block';
      routineCard.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'rc-title';
      title.textContent = `Rutina de hoy · ${todayEntry.group}`;
      routineCard.appendChild(title);
      routineCard.appendChild(buildExerciseList(todayEntry, true));
    } else {
      headline.textContent = 'Descanso';
      headline.classList.add('rest');
      subline.textContent = 'Hoy no hay entrenamiento en tu calendario.';
      routineCard.style.display = 'none';
    }

    const barbell = document.getElementById('barbell');
    barbell.innerHTML = '';
    barbell.appendChild(makeBarSegment());
    BASE_DAYS.forEach(d => {
      barbell.appendChild(makePlate(d, todayEntry));
      barbell.appendChild(makeBarSegment());
    });

    const list = document.getElementById('list');
    list.innerHTML = '';
    BASE_DAYS.forEach(d => list.appendChild(makeRow(d, todayEntry)));

    const doneCount = BASE_DAYS.filter(d => dayState[d.id]).length;
    document.getElementById('progressText').textContent = `${doneCount}/${BASE_DAYS.length}`;
    document.getElementById('progressFill').style.width = `${(doneCount/BASE_DAYS.length)*100}%`;
  }

  function makeBarSegment(){ const seg = document.createElement('div'); seg.className = 'bar-line'; return seg; }

  function makePlate(d, todayEntry){
    const el = document.createElement('div');
    el.className = 'plate' + (dayState[d.id] ? ' done' : '') + (todayEntry && d.id === todayEntry.id ? ' today' : '');
    el.innerHTML = `<span class="letter">${d.short}</span><span class="dot"></span>`;
    el.addEventListener('click', () => toggleDay(d.id));
    return el;
  }

  function makeRow(d, todayEntry){
    const el = document.createElement('div');
    el.className = 'row' + (dayState[d.id] ? ' done' : '');

    const main = document.createElement('div');
    main.className = 'row-main';
    main.innerHTML = `
      <div class="row-left">
        <div class="checkbox">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <path d="M1 5L4.5 8.5L11 1" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="row-text">
          <span class="row-label">${d.label}${todayEntry && d.id===todayEntry.id ? ' · hoy' : ''}</span>
          <span class="row-group">${d.group}</span>
        </div>
      </div>
      <div class="row-right">
        <span class="row-status">${dayState[d.id] ? 'Hecho' : 'Pendiente'}</span>
        <div class="chevron${expanded[d.id] ? ' open' : ''}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 4.5L7 9.5L12 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    `;

    main.querySelector('.row-left').addEventListener('click', () => toggleDay(d.id));
    main.querySelector('.row-right .row-status').addEventListener('click', () => toggleDay(d.id));
    main.querySelector('.chevron').addEventListener('click', (e) => {
      e.stopPropagation(); expanded[d.id] = !expanded[d.id]; render();
    });

    const exWrap = document.createElement('div');
    exWrap.className = 'row-exercises' + (expanded[d.id] ? ' open' : '');
    const inner = document.createElement('div');
    inner.className = 'row-exercises-inner';
    inner.appendChild(buildExerciseList(d, true));
    exWrap.appendChild(inner);

    el.appendChild(main); el.appendChild(exWrap);
    return el;
  }

  function toggleDay(id){
    dayState[id] = !dayState[id];
    if(dayState[id]) { 
      streak++; 
      triggerConfetti(); 
      playRonnieColemanAudio();
    } else { 
      streak = Math.max(0, streak - 1); 
    }
    saveStreak(); saveWeekState(); render();
  }

  function toggleExercise(dayId, exName){
    if(!exState[dayId]) exState[dayId] = {};
    exState[dayId][exName] = !exState[dayId][exName];
    
    const allEx = fullExercises(BASE_DAYS.find(b => b.id === dayId));
    if(allEx.length > 0 && allEx.every(e => exState[dayId][e]) && !dayState[dayId]) {
      dayState[dayId] = true; streak++; saveStreak(); triggerConfetti(); playRonnieColemanAudio();
    }
    saveWeekState(); render();
  }

  function addExercise(dayId, exName){
    if(!extra[dayId]) extra[dayId] = [];
    if(!extra[dayId].includes(exName)){ extra[dayId].push(exName); saveExtra(); }
    render();
  }

  function removeExercise(dayId, exName){
    if(extra[dayId]){ extra[dayId] = extra[dayId].filter(e => e !== exName); saveExtra(); }
    render();
  }

  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  function openChartModal(exName) {
    document.getElementById('chartTitle').textContent = `Progresión: ${exName}`;
    document.getElementById('chartModal').classList.add('active');
    
    const canvas = document.getElementById('progressChart');
    const ctx = canvas.getContext('2d');
    const data = historyData[exName] || [];

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;

    if(data.length < 2) {
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text-muted');
      ctx.font = '12px Inter';
      ctx.fillText('Registrá al menos 2 cargas para ver el gráfico', 20, canvas.height / 2);
      return;
    }

    const padding = 30;
    const weights = data.map(d => d.kg);
    const maxW = Math.max(...weights, 10); const minW = Math.min(...weights, 0);

    ctx.beginPath();
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent');
    ctx.lineWidth = 2;

    data.forEach((pt, i) => {
      const x = padding + (i / (data.length - 1)) * (canvas.width - padding * 2);
      const y = canvas.height - padding - ((pt.kg - minW) / (maxW - minW || 1)) * (canvas.height - padding * 2);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--accent');
      ctx.fillRect(x - 3, y - 3, 6, 6);
    });
    ctx.stroke();
  }

  function open1RMModal() { document.getElementById('rmModal').classList.add('active'); }
  function calculate1RM() {
    const w = parseFloat(document.getElementById('rmWeight').value);
    const r = parseInt(document.getElementById('rmReps').value);
    if(w && r) {
      const rm = Math.round(w * (1 + r / 30));
      document.getElementById('rmResult').textContent = `Tu 1RM estimado: ${rm} kg`;
    }
  }

  function openWizardModal() {
    wizardStep = 0;
    tempRoutine = JSON.parse(JSON.stringify(BASE_DAYS));
    renderWizardStep();
    document.getElementById('wizardModal').classList.add('active');
  }

  function renderWizardStep() {
    const day = tempRoutine[wizardStep];
    const container = document.getElementById('wizardBody');
    container.innerHTML = '';

    const title = document.createElement('div');
    title.className = 'wizard-step-title';
    title.textContent = `Paso ${wizardStep + 1} de 7: ${day.label}`;

    const sub = document.createElement('div');
    sub.className = 'wizard-step-sub';
    sub.textContent = 'Elegí el enfoque muscular y tildá los ejercicios que vas a hacer.';

    const select = document.createElement('select');
    select.className = 'wizard-select';
    Object.keys(PRESET_EXERCISES).concat(['Personalizado']).forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      if(day.group === g) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener('change', (e) => {
      day.group = e.target.value;
      renderWizardStep();
    });

    const list = document.createElement('div');
    list.className = 'wizard-list';

    const availableEx = PRESET_EXERCISES[day.group] || day.exercises;
    const combinedEx = Array.from(new Set([...availableEx, ...day.exercises]));

    combinedEx.forEach(ex => {
      const item = document.createElement('label');
      item.className = 'wizard-item';
      
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = day.exercises.includes(ex);
      chk.addEventListener('change', (e) => {
        if(e.target.checked) {
          if(!day.exercises.includes(ex)) day.exercises.push(ex);
        } else {
          day.exercises = day.exercises.filter(i => i !== ex);
        }
      });

      item.appendChild(chk);
      item.appendChild(document.createTextNode(ex));
      list.appendChild(item);
    });

    const customRow = document.createElement('div');
    customRow.className = 'custom-row';
    customRow.style.marginTop = '8px';
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = 'Agregar otro ejercicio';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => {
      const v = input.value.trim();
      if(v && !day.exercises.includes(v)) {
        day.exercises.push(v);
        renderWizardStep();
      }
    });

    customRow.appendChild(input); customRow.appendChild(addBtn);

    container.appendChild(title);
    container.appendChild(sub);
    container.appendChild(select);
    container.appendChild(list);
    container.appendChild(customRow);

    document.getElementById('wizPrevBtn').style.display = wizardStep === 0 ? 'none' : 'block';
    document.getElementById('wizNextBtn').textContent = wizardStep === 6 ? 'Guardar Todo' : 'Siguiente';
  }

  function wizNext() {
    if(wizardStep < 6) {
      wizardStep++;
      renderWizardStep();
    } else {
      BASE_DAYS = tempRoutine;
      localStorage.setItem(customRoutineKey, JSON.stringify(BASE_DAYS));
      closeModal('wizardModal');
      render();
    }
  }

  function wizPrev() {
    if(wizardStep > 0) {
      wizardStep--;
      renderWizardStep();
    }
  }

  function openTutorialModal() {
    obStep = 3;
    tutorialStep = 0;
    document.getElementById('onboardingModal').classList.add('active');
    renderOnboardingStep();
  }

  function runOnboarding() {
    document.getElementById('onboardingModal').classList.add('active');
    renderOnboardingStep();
  }

  function renderOnboardingStep() {
    const b = document.getElementById('onboardingBody');
    b.innerHTML = '';

    if(obStep === 0) {
      b.innerHTML = `
        <div class="wizard-step-title">¡Bienvenido/a a LiftLog!</div>
        <div class="wizard-step-sub">Para empezar a armar tu experiencia, ¿cómo te llamás?</div>
        <input type="text" id="obNameInput" class="wizard-select" placeholder="Ingresá tu nombre" style="margin-bottom:20px;">
        <button class="timer-btn" style="width:100%; padding:10px; background:var(--accent); color:#0E0E10;" onclick="saveOnboardingName()">Siguiente ➔</button>
      `;
    } else if(obStep === 3) {
      const tuts = [
        { title: '📌 Registro Diario', text: 'Tildá las casillas de los ejercicios a medida que los completes para ir aumentando tu racha diaria.' },
        { title: '⏱️ Temporizador', text: 'Usá los botones de 60s, 90s o 2m entre series para controlar tus tiempos de descanso exactos.' },
        { title: '📈 Progresión y 1RM', text: 'Anotá tus kilos y repeticiones. Tocá el ícono 📈 en cada ejercicio para ver tu gráfico de avance.' }
      ];
      const cur = tuts[tutorialStep];
      b.innerHTML = `
        <div class="wizard-step-title">Tutorial (${tutorialStep + 1}/3)</div>
        <div style="font-size:16px; font-weight:700; margin:10px 0 4px;">${cur.title}</div>
        <div class="wizard-step-sub">${cur.text}</div>
        <button class="timer-btn" style="width:100%; padding:10px; background:var(--accent); color:#0E0E10; margin-top:14px;" onclick="nextTutorialStep()">
          ${tutorialStep === 2 ? 'Finalizar Tutorial' : 'Siguiente ➔'}
        </button>
      `;
    } else if(obStep === 4) {
      b.innerHTML = `
        <div class="train-overlay">
          <div class="train-title">¡A ENTRENAR!</div>
          <div style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">Tu rutina ya está lista. ¡A darlo todo hoy!</div>
          <button class="timer-btn" style="width:100%; padding:12px; background:var(--accent); color:#0E0E10; font-weight:700;" onclick="finishOnboarding()">¡VAMOS! 💪</button>
        </div>
      `;
      triggerConfetti();
      playRonnieColemanAudio();
    }
  }

  function saveOnboardingName() {
    const v = document.getElementById('obNameInput').value.trim();
    if(v) {
      userName = v;
      localStorage.setItem(userNameKey, userName);
      obStep = 3;
      renderOnboardingStep();
    }
  }

  function nextTutorialStep() {
    if(tutorialStep < 2) {
      tutorialStep++;
      renderOnboardingStep();
    } else {
      obStep = 4;
      renderOnboardingStep();
    }
  }

  function finishOnboarding() {
    closeModal('onboardingModal');
    render();
  }

  function exportJSON() {
    const data = { routine: BASE_DAYS, history: historyData, streak: streak, userName: userName };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'liftlog_backup.json';
    a.click();
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if(parsed.routine) localStorage.setItem(customRoutineKey, JSON.stringify(parsed.routine));
        if(parsed.history) localStorage.setItem(historyKey, JSON.stringify(parsed.history));
        if(parsed.streak) localStorage.setItem(streakKey, parsed.streak.toString());
        if(parsed.userName) localStorage.setItem(userNameKey, parsed.userName);
        loadState(); render(); closeModal('wizardModal');
      } catch(err) { alert('Archivo JSON inválido'); }
    };
    reader.readAsText(file);
  }

  document.getElementById('themeBtn').addEventListener('click', () => {
    if(document.body.getAttribute('data-theme') === 'light') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', 'light');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    BASE_DAYS.forEach(d => { dayState[d.id] = false; exState[d.id] = {}; });
    saveWeekState(); render();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  loadState();
  if(!userName) {
    runOnboarding();
  } else {
    render();
  }
</script>
</body>
</html>
